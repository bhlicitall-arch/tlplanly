services:
  - type: web
    name: tlplanly
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: DATABASE_URL
        fromDatabase:
          name: tlplanly-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: tlplanly-postgres
    databaseName: tlplanly
    user: tlplanly_app
    postgresMajorVersion: "16"
    plan: basic-256mb
    ipAllowList: []
